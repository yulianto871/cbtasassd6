<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ASAS — Asesmen Sumatif Akhir Semester</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">

<style>
:root{--r:#c8102e;--s:#fdf2f4;--t:#222;--m:#666;--b:#e4e4e7;--ok:#166534;--okb:#dcfce7}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--t);background:#fafafa;font-size:17px;line-height:1.6}
header{background:var(--r);color:#fff;padding:12px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;position:sticky;top:0;z-index:5}
header b{font-size:19px}nav{display:flex;gap:8px;flex-wrap:wrap}
nav button,.btn{background:var(--r);color:#fff;border:1px solid transparent;border-radius:10px;padding:10px 16px;font-size:16px;font-weight:600;cursor:pointer}
nav button{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.35)}nav button.on{background:#fff;color:var(--r)}
.btn.o{background:#fff;color:var(--r);border-color:var(--r)}.btn.s{padding:6px 12px;font-size:14px}.btn:disabled{opacity:.45;cursor:not-allowed}
main{max-width:960px;margin:0 auto;padding:18px}.card{background:#fff;border:1px solid var(--b);border-radius:14px;padding:18px;margin-bottom:16px}
.hero{display:grid;grid-template-columns:1.2fr .8fr;gap:18px;align-items:center}.hero img{width:100%;max-height:260px;object-fit:cover;border-radius:12px}
@media(max-width:720px){.hero{grid-template-columns:1fr}}
label{display:block;font-weight:600;margin:10px 0 4px}input,select,textarea{width:100%;padding:10px 12px;border:1px solid #cbd5e1;border-radius:10px;font:inherit}
input[type=checkbox],input[type=radio]{width:20px;height:20px;accent-color:var(--r);flex:none}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.mc{border:2px solid var(--b);border-radius:14px;padding:16px;text-align:center;cursor:pointer;background:#fff}.mc .ic{font-size:38px}.mc:hover{border-color:var(--r);background:var(--s)}
.q{background:#fff;border:1px solid var(--b);border-radius:14px;padding:20px;margin-bottom:16px}.qn{font-size:14px;color:var(--m);font-weight:700;text-transform:uppercase}.qt{font-size:21px;font-weight:600;margin:6px 0 12px}
.stim{background:#f8fafc;border-left:4px solid var(--r);padding:12px;border-radius:8px;margin:10px 0}.stim img,.q img{max-width:100%;max-height:360px;border-radius:8px;display:block;margin:8px 0}.stim iframe{width:100%;height:340px;border:0;border-radius:8px}
.stim table{background:#fff;margin:4px 0}
.ch{display:flex;align-items:center;gap:12px;border:2px solid var(--b);border-radius:12px;padding:12px 14px;margin:8px 0;cursor:pointer;font-size:19px}.ch:has(input:checked){border-color:var(--r);background:var(--s)}.ch img{max-height:90px}
.ch i{font-style:normal;font-weight:700;color:var(--r);min-width:22px}.hint{font-size:15px;color:var(--m);margin:4px 0 8px}
.op{display:flex;align-items:center;gap:10px;border:1px solid var(--b);border-radius:10px;padding:8px 12px;margin:6px 0;font-weight:400}.op img.th{width:46px;height:46px;object-fit:cover;border-radius:6px}
table{width:100%;border-collapse:collapse;font-size:16px}th,td{border:1px solid var(--b);padding:9px;text-align:left}th{background:var(--s)}
.navq{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}.navq button{width:40px;height:40px;border-radius:10px;border:1px solid var(--b);background:#fff;font-weight:700;cursor:pointer}.navq button.dn{background:var(--okb);border-color:var(--ok)}.navq button.cr{background:var(--r);color:#fff}
.bar{position:sticky;top:58px;z-index:4;background:#fff;border:1px solid var(--b);border-radius:12px;padding:10px 14px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.tm{font-size:20px;font-weight:800;color:var(--r)}.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:14px;z-index:20}.modal>div{background:#fff;border-radius:16px;max-width:760px;width:100%;max-height:90vh;overflow:auto;padding:20px}
.modal>div.ed-wide{max-width:1280px;width:96vw}
.ed-split{display:grid;grid-template-columns:1.1fr .9fr;gap:20px;align-items:start}
.ed-pv{position:sticky;top:0;background:#f8fafc;border:1px solid var(--b);border-radius:14px;padding:16px;max-height:82vh;overflow:auto}
.ed-pv-hd{font-size:13px;font-weight:700;color:var(--m);text-transform:uppercase;letter-spacing:.4px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
@media(max-width:960px){.ed-split{grid-template-columns:1fr}.ed-pv{position:static;max-height:none}}
.tbl-ed{overflow-x:auto;margin:8px 0}.tbl-ed table{background:#fff}.tbl-ed input{padding:6px 8px;border-radius:6px;font-size:15px}
.drop{border:2px dashed #cbd5e1;border-radius:12px;padding:14px;text-align:center;color:var(--m);cursor:pointer;margin:6px 0}.drop:hover{border-color:var(--r);background:var(--s)}
.eqb{background:#f8fafc;border:1px solid var(--b);border-radius:10px;padding:8px;margin-bottom:10px}.eqr{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:6px}.eqr button{padding:4px 9px;border:1px solid var(--b);background:#fff;border-radius:7px;cursor:pointer;font-size:15px}.eqr button:hover{border-color:var(--r);background:var(--s)}
.eqp{background:#fff;border:1px dashed #cbd5e1;border-radius:8px;padding:6px 10px;min-height:32px;font-size:18px}
.podium{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;text-align:center;margin-bottom:14px}.pd{background:#fff;border:2px solid var(--b);border-radius:14px;padding:14px}.pd:first-child{border-color:#eab308;background:#fefce8}.pd .em{font-size:32px}.pd b{display:block;font-size:18px}.pd span{font-size:22px;font-weight:800;color:var(--r)}
.cert{border:6px double var(--r);border-radius:16px;padding:26px;background:#fff;text-align:center}.cert h1{color:var(--r);margin:4px 0}
.kisi{width:100%;border-collapse:collapse;font-size:13.5px;margin-top:10px}.kisi th,.kisi td{border:1px solid #cbd5e1;padding:6px 8px;vertical-align:top}.kisi th{background:#f1f5f9;font-weight:700}.kisi td.c{text-align:center}
@media print{header,.noprint{display:none!important}body{background:#fff}main{max-width:none;padding:0}}
</style></head><body>
<header><b>📝 ASAS Online</b><nav id="nav"></nav></header><main id="app"></main><div id="mod"></div>
<script>
const SB={url:'https://wntmzxnuyzrypjkxojdx.supabase.co',key:'sb_publishable_k0gL9vU7U0g1x39e5wE98g_8T7S2L_w'};
const sb=SB.url?supabase.createClient(SB.url,SB.key):null;
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const DEF_IMG='data:image/svg+xml;utf8,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 260"><rect width="420" height="260" rx="20" fill="#fdf2f4"/><circle cx="340" cy="60" r="44" fill="#fecdd3"/><rect x="44" y="46" width="210" height="168" rx="14" fill="#fff" stroke="#c8102e" stroke-width="4"/><rect x="66" y="74" width="130" height="14" rx="7" fill="#c8102e"/><rect x="66" y="104" width="160" height="10" rx="5" fill="#cbd5e1"/><rect x="66" y="126" width="145" height="10" rx="5" fill="#cbd5e1"/><circle cx="76" cy="162" r="10" fill="#16a34a"/><rect x="96" y="156" width="110" height="12" rx="6" fill="#94a3b8"/><path d="M295 195l68-68 22 22-68 68-28 6z" fill="#c8102e"/></svg>`);
const DEF={cfg:{title:'Asesmen Sumatif Akhir Semester (ASAS)',sub:'Penilaian Akhir Semester Berbasis Komputer',about:'Selamat datang di portal ASAS. Pilih mata pelajaran, isi identitas dengan benar, lalu kerjakan soal dengan teliti dan jujur.',school:'SD Negeri 1 Contoh',hero:'',color:'#c8102e',dur:60,maxV:3,only:false,shuf:true,shufOpt:true,retake:false,pub:true,pwh:'240be518fabd2724ddb6f04eeb1da5967448d7e831c08c8fa822809f74c720a9'},
mapel:[{id:'mtk',nama:'Matematika',icon:'➗',kode:''},{id:'bin',nama:'Bahasa Indonesia',icon:'📖',kode:''},{id:'ipa',nama:'IPAS',icon:'🔬',kode:''}],
soal:[{id:'s1',mp:'mtk',type:'pg',text:'Hasil dari $\\frac{3}{4} + \\frac{1}{2}$ adalah ...',stim:{k:'none',v:''},opts:[{t:'$1\\frac{1}{4}$'},{t:'$\\frac{4}{6}$'},{t:'$1\\frac{1}{2}$'},{t:'$\\frac{5}{4}$ (salah)'}],key:0,pts:1},
{id:'s2',mp:'mtk',type:'mcma',text:'Pilih 2 bilangan yang merupakan faktor dari 18!',stim:{k:'none',v:''},opts:[{t:'4'},{t:'6'},{t:'9'},{t:'12'}],key:[1,2],pts:1},
{id:'s3',mp:'bin',type:'kat',text:'Tentukan Benar atau Salah pernyataan berikut berdasarkan teks!',stim:{k:'text',v:'Air bersih sangat penting bagi kesehatan. Setiap hari kita membutuhkan air minum yang cukup agar tubuh tidak kekurangan cairan.'},lab:'Benar|Salah',opts:[{t:'Tubuh membutuhkan air minum setiap hari.'},{t:'Air bersih tidak berpengaruh pada kesehatan.'}],key:[true,false],pts:1}],
peserta:[{id:'1',nama:'Budi Santoso',presensi:'1',kelas:6,sekolah:'SD Negeri 1 Contoh'}],hasil:[]};
let db=JSON.parse(JSON.stringify(DEF)),view='home',at='soal',T=null,A={},qi=0,tmr=null,sisa=0,viol=0,last=null,E=null,tgt='',fm='',bm='',PW=sessionStorage.pw||'';
const adm=()=>Boolean(PW);
const uid=()=>'id'+Math.random().toString(36).slice(2,9);
const sha=async s=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)))].map(b=>b.toString(16).padStart(2,'0')).join('');
const toast=m=>{let t=$('#tst');if(!t){t=document.createElement('div');t.id='tst';t.style.cssText='position:fixed;bottom:16px;right:16px;background:#1e293b;color:#fff;padding:10px 14px;border-radius:10px;font-size:14px;z-index:99';document.body.appendChild(t)}t.textContent=m;clearTimeout(t._t);t._t=setTimeout(()=>t.remove(),2600)};
const rpc=async(fn,p={})=>{const{data,error}=await sb.rpc(fn,p);if(error)throw error;return data};
async function load(){if(SB.url){try{const d=await rpc(adm()?'app_admin_load':'app_public_load',adm()?{p_pw:PW}:{});if(d&&d.cfg){db={...DEF,...d,cfg:{...DEF.cfg,...d.cfg}};db.peserta=(db.peserta||[]).map(p=>({...p,id:String(p.presensi)}));document.documentElement.style.setProperty('--r',db.cfg.color||'#c8102e');R();return}}catch(e){if(adm()){PW='';sessionStorage.pw='';alert('Sesi admin berakhir atau kata sandi salah.')}console.error(e)}}
try{const r=await fetch('data.json?v='+Date.now());if(r.ok)db={...db,...await r.json()}}catch(e){}
try{const d=JSON.parse(localStorage.cbt_draft);if(d)db={...db,...d}}catch(e){}
document.documentElement.style.setProperty('--r',db.cfg.color||'#c8102e');R()}
const store=()=>{if(!SB.url)localStorage.cbt_draft=JSON.stringify(db)};
async function sv(tb,row){if(SB.url){await rpc('app_save',{p_pw:PW,p_table:tb,p_row:row});if(tb=='cfg')db.cfg=row;else{const L=db[tb],i=L.findIndex(x=>x.id==row.id);i<0?L.push(row):L[i]=row}return}
if(tb=='cfg')db.cfg=row;else{const L=db[tb],i=L.findIndex(x=>x.id==row.id);i<0?L.push(row):L[i]=row}store()}
async function rm(tb,id){if(SB.url){await rpc('app_delete',{p_pw:PW,p_table:tb,p_id:String(id)});db[tb]=db[tb].filter(x=>x.id!=id);return}
db[tb]=db[tb].filter(x=>x.id!=id);store()}
const mnm=id=>(db.mapel.find(m=>m.id==id)||{}).nama||'-';
const msel=(v,vr)=>`<select style="width:auto;min-width:190px;margin:0" onchange="${vr}=this.value;R()"><option value="">Semua mata pelajaran</option>${db.mapel.map(m=>`<option value="${m.id}" ${v==m.id?'selected':''}>${esc(m.nama)}</option>`).join('')}</select>`;
const go=v=>{view=v;R()};
function R(){const n=[['home','Beranda'],['board','Papan Peringkat'],['unduh','Unduh Hasil'],['admin','Admin']];
$('#nav').innerHTML=view=='tes'?'':n.map(([k,l])=>`<button class="${view==k?'on':''}" onclick="go('${k}')">${l}</button>`).join('');
$('#app').innerHTML=({home,mulai,tes,selesai,board,unduh,admin}[view]||home)()}
const home=()=>`<div class="card hero"><div><h1>${esc(db.cfg.title)}</h1><p><b>${esc(db.cfg.sub)}</b></p><p>${esc(db.cfg.about)}</p><p>⏱️ Durasi: <b>${db.cfg.dur} menit</b> · 🚫 Batas keluar layar: <b>${db.cfg.maxV}x</b></p></div><img src="${esc(db.cfg.hero||DEF_IMG)}" onerror="this.src=DEF_IMG"></div>
<h2>Pilih Mata Pelajaran</h2>${!db.cfg.pub?'<div class=card>Tes belum dibuka oleh guru/admin.</div>':`<div class=grid>${db.mapel.map(m=>{const c=db.soal.filter(q=>q.mp==m.id).length;return`<div class=mc onclick="pilihM('${m.id}')"><div class=ic>${esc(m.icon||'📘')}</div><b>${esc(m.nama)}</b><div class=hint>${c} soal</div></div>`}).join('')||'<div class=card>Belum ada mata pelajaran.</div>'}</div>`}`;
function pilihM(id){const m=db.mapel.find(x=>x.id==id);if(!m)return;if(!db.soal.some(q=>q.mp==id))return alert('Soal untuk mata pelajaran ini belum tersedia.');
if(m.kode){const k=prompt('Masukkan kode akses mata pelajaran '+m.nama+':');if(k===null)return;if(k.trim()!=m.kode)return alert('Kode akses salah.')}
T={mp:id,mn:m.nama};go('mulai')}
const mulai=()=>`<div class=card><h2>Identitas Peserta — ${esc(T.mn)}</h2>
<label>Nomor presensi<input id=no type=number min=1 oninput="isiP(this.value)"></label>
<label>Nama lengkap<input id=nm ${db.cfg.only?'readonly':''}></label>
<div class=row><div style="flex:1"><label>Kelas<input id=kl value="6"></label></div><div style="flex:2"><label>Sekolah<input id=sk value="${esc(db.cfg.school)}"></label></div></div>
<p style="color:var(--m);font-size:15px">⚠️ Selama tes berlangsung, jangan berpindah tab/aplikasi atau keluar dari layar penuh. Pelanggaran melebihi ${db.cfg.maxV}x akan mengirim jawaban otomatis.</p>
<div class=row><button class=btn onclick="start()">Mulai mengerjakan</button><button class="btn o" onclick="go('home')">Kembali</button></div></div>`;
function isiP(v){const p=db.peserta.find(x=>x.presensi==v);if(p){$('#nm').value=p.nama;$('#kl').value=p.kelas||6;$('#sk').value=p.sekolah||db.cfg.school}else if(db.cfg.only)$('#nm').value=''}
const mine=()=>{try{return JSON.parse(localStorage.cbt_mine)||[]}catch(e){return[]}};
function start(){const no=$('#no').value.trim(),nm=$('#nm').value.trim(),kl=$('#kl').value.trim(),sk=$('#sk').value.trim();
if(!no||!nm)return alert('Isi nomor presensi dan nama lengkap.');
if(db.cfg.only&&!db.peserta.some(x=>x.presensi==no&&x.nama.toLowerCase()==nm.toLowerCase()))return alert('Nomor presensi dan nama tidak terdaftar pada daftar anggota.');
if(!db.cfg.retake&&db.hasil.concat(mine()).some(h=>h.presensi==no&&h.mp==T.mp))return alert('Nomor presensi ini sudah mengerjakan mata pelajaran ini.');
let L=db.soal.filter(q=>q.mp==T.mp).map(q=>JSON.parse(JSON.stringify(q)));
if(db.cfg.shuf)L=shf(L,no+T.mp);
T={...T,no,nm,kl,sk,L,t0:Date.now()};A={};qi=0;viol=0;sisa=db.cfg.dur*60;
document.documentElement.requestFullscreen?.().catch(()=>{});
clearInterval(tmr);tmr=setInterval(()=>{sisa--;if($('#tm'))$('#tm').textContent=fmt(sisa);if(sisa<=0)kirim(true)},1000);go('tes')}
const fmt=s=>`${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;
const answered=q=>{const a=A[q.id];return q.type=='pg'?a!=null:q.type=='mcma'?Array.isArray(a)&&a.length>0:q.type=='kat'?Array.isArray(a)&&q.opts.every((_,i)=>typeof a[i]=='boolean'):q.type=='jodoh'?Array.isArray(a)&&q.pairs.every((_,i)=>a[i]):String(a||'').trim()!==''};
const tes=()=>`<div class=bar><div><b>${esc(T.mn)}</b> · ${esc(T.nm)} (No. ${esc(T.no)})</div><div class=row><span class=tm id=tm>${fmt(sisa)}</span><button class="btn s" onclick="cekKirim()">Kumpulkan</button></div></div>
<div class=navq>${T.L.map((q,i)=>`<button class="${i==qi?'cr':answered(q)?'dn':''}" onclick="qi=${i};R()">${i+1}</button>`).join('')}</div>
${qH(T.L[qi],qi+1,T.L.length)}
<div class=row style="justify-content:space-between"><button class="btn o" ${qi?'':'disabled'} onclick="qi--;R()">⬅️ Sebelumnya</button><button class=btn onclick="${qi<T.L.length-1?'qi++;R()':'cekKirim()'}">${qi<T.L.length-1?'Berikutnya ➡️':'✅ Selesai & Kirim'}</button></div>`;
function cekKirim(){const u=T.L.filter(q=>!answered(q)).length;if(confirm(u?`Masih ada ${u} soal belum dijawab. Tetap kirim jawaban?`:'Kirim semua jawaban sekarang?'))kirim(false)}
async function kirim(auto){clearInterval(tmr);document.exitFullscreen?.().catch(()=>{});
const dur=Math.round((Date.now()-T.t0)/1000),skor=score(T.L,A);
const h={id:uid(),mp:T.mp,mn:T.mn,nama:T.nm,presensi:T.no,kelas:T.kl,sekolah:T.sk,skor,durasi:dur,viol,lewat:auto,waktu:new Date().toLocaleString('id-ID'),jawaban:A};
last=h;const m=mine();m.push(h);localStorage.cbt_mine=JSON.stringify(m);
if(SB.url){try{await rpc('app_submit',{p_row:h})}catch(e){toast('⚠️ Gagal mengirim ke server, simpan berkas cadangan.')}}else{db.hasil.push(h);store()}
T=null;go('selesai')}
document.addEventListener('visibilitychange',()=>{if(view=='tes'&&document.hidden)catatV('Berpindah tab atau meminimalkan jendela')});
window.addEventListener('blur',()=>{if(view=='tes')catatV('Keluar dari layar tes')});
let lastV=0;function catatV(alasan){if(Date.now()-lastV<1500)return;lastV=Date.now();viol++;if(viol>db.cfg.maxV){alert('Batas pelanggaran terlampaui. Jawaban otomatis dikirim.');kirim(true)}else alert(`⚠️ Peringatan ${viol}/${db.cfg.maxV}: ${alasan}.`)}
const selesai=()=>{const c=btoa(unescape(encodeURIComponent(JSON.stringify(last))));return `${cert(last)}<div class="card noprint"><h3>Langkah berikutnya</h3><p>${SB.url?'Hasilmu sudah terkirim otomatis ke guru. Simpan bukti atau cetak sertifikat bila diperlukan.':'Unduh berkas hasil lalu kirim ke guru (WhatsApp/Google Form), atau salin kode hasil.'}</p><div class=row><button class=btn onclick="window.print()">🖨️ Cetak / Simpan PDF</button>${SB.url?'':`<button class="btn o" onclick="dlH()">⬇️ Unduh berkas hasil</button><button class="btn o" onclick="navigator.clipboard?.writeText('${c}');alert('Kode hasil disalin!')">📋 Salin kode hasil</button>`}<button class="btn o" onclick="go('home')">Selesai</button></div></div>`};
function dlH(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(last)],{type:'application/json'}));a.download=`hasil-${last.mn}-${last.presensi}-${last.nama}.json`;a.click()}

case'mcma':return[...a].sort()+''==[...q.key].sort()+''?1:0;
case'kat':return q.key.filter((k,i)=>a[i]===k).length/q.key.length;
case'isian':return q.key.split('|').some(k=>n(k)==n(a))?1:0;
case'jodoh':return q.pairs.filter((p,i)=>a[i]===p.r).length/q.pairs.length;
default:{const w=q.key.split(',').map(n).filter(Boolean);return w.length?w.filter(x=>n(a).includes(x)).length/w.length:0}}}
const score=(L,a)=>{let t=0,g=0;L.forEach(q=>{if(!hk(q))return;const p=+q.pts||1;t+=p;g+=sc(q,a[q.id])*p});return t?Math.round(g/t*100):0};
