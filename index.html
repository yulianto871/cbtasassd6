<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CBT ASAS Sekolah Dasar</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@400;600;800&display=swap" rel="stylesheet"><style>
:root{--r:#d7263d;--t:#3a1d22;--m:#8a6a70;--b:#f8d9de;--s:#fff3f5}
*{box-sizing:border-box}
body{margin:0;font:18px/1.6 Nunito,"Segoe UI",system-ui,sans-serif;color:var(--t);background:#fff;min-height:100vh;display:flex;flex-direction:column}
h1,h2,.big,nav b,.btn,.pill{font-family:"Baloo 2",Nunito,system-ui,sans-serif}
main{flex:1;max-width:1000px;width:100%;margin:0 auto;padding:22px 16px}
nav{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:10px 16px;background:#fff;border-bottom:4px solid var(--r);position:sticky;top:0;z-index:4}
nav b{margin-right:auto;color:var(--r);font-size:22px}
nav a{cursor:pointer;border-radius:999px;padding:7px 14px;font-weight:800;font-size:15px;color:var(--t)}nav a:hover{background:var(--s)}nav a.on{background:var(--r);color:#fff}
.btn{cursor:pointer;border:0;border-radius:999px;padding:11px 22px;background:var(--r);color:#fff;font-size:17px;font-weight:600;display:inline-block;box-shadow:0 4px 0 color-mix(in srgb,var(--r) 65%,#000);transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 color-mix(in srgb,var(--r) 65%,#000)}.btn[disabled]{opacity:.4;pointer-events:none}
.btn.o{background:#fff;color:var(--r);border:2px solid var(--r);box-shadow:0 3px 0 var(--b)}.btn.s{padding:3px 12px;font-size:14px;box-shadow:none}
footer{text-align:center;padding:14px;background:var(--r);color:#fff;font-size:14px;font-weight:700}
h1{font-size:clamp(28px,6vw,44px);line-height:1.1;margin:0 0 10px;color:var(--r)}h2{margin:16px 0 8px;color:var(--r)}
.hero{position:relative;overflow:hidden;display:flex;gap:20px;align-items:center;flex-wrap:wrap;background:linear-gradient(135deg,#fff,var(--s));border:3px solid var(--b);border-radius:28px;padding:28px}
.hero::after{content:"📚 ✏️ 🎒";position:absolute;right:16px;bottom:6px;font-size:34px;opacity:.25;letter-spacing:8px}
.hero img{max-width:260px;border-radius:20px;flex:1 1 200px}.hero div{flex:2 1 280px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin:16px 0}
.stats div{border:3px solid var(--b);border-radius:20px;padding:12px;text-align:center;font-weight:700;background:#fff}.stats b{display:block;font:800 30px "Baloo 2";color:var(--r)}.em2{font-size:26px;display:block}
.card{border:3px solid var(--b);border-radius:22px;padding:18px;margin:14px 0;background:#fff;box-shadow:0 5px 0 var(--s)}
input,select,textarea{font:inherit;padding:11px 14px;border:2px solid var(--b);border-radius:14px;width:100%;margin:4px 0 10px;background:#fff}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--r);box-shadow:0 0 0 4px var(--s)}
input[type=radio],input[type=checkbox]{width:22px;height:22px;margin:0 8px 0 0;accent-color:var(--r)}
label{display:block;font-weight:800;font-size:15px}
.op{display:flex;align-items:center;font-weight:600;font-size:16px;padding:9px 12px;border:2px solid var(--b);border-radius:14px;margin:5px 0;cursor:pointer}
.ch{position:relative;display:flex;align-items:center;gap:12px;padding:13px 16px;border:3px solid var(--b);border-radius:18px;margin:10px 0;cursor:pointer;font-weight:600;font-size:18px;background:#fff;transition:.12s}
.ch:hover{background:var(--s);transform:translateY(-1px)}.ch input{position:absolute;opacity:0;width:1px;height:1px;margin:0}
.ch i{font:800 18px "Baloo 2";font-style:normal;width:38px;height:38px;border-radius:50%;background:var(--s);color:var(--r);display:grid;place-items:center;flex:none}
.ch:has(input:checked){border-color:var(--r);background:var(--s)}.ch:has(input:checked) i{background:var(--r);color:#fff}
.hint{margin:6px 0;color:var(--m);font-weight:700}
table{width:100%;border-collapse:collapse}th,td{border-bottom:2px solid var(--s);padding:8px 6px;text-align:left;font-size:16px}th{background:var(--s);color:var(--r)}
.qn{display:inline-block;background:var(--r);color:#fff;border-radius:999px;padding:2px 16px;font:600 16px "Baloo 2"}.qt{font-size:21px;font-weight:800;margin:10px 0}
.stim{background:var(--s);border-left:6px solid var(--r);border-radius:14px;padding:12px 14px;margin:10px 0;white-space:pre-wrap}.q img,.stim img{max-width:100%;border-radius:14px}.q iframe{width:100%;height:380px;border:2px solid var(--b);border-radius:14px}
.row{display:flex;gap:8px;align-items:center;margin:5px 0;flex-wrap:wrap}.row input[type=text],.row input:not([type]){flex:1;margin:0;min-width:120px}.th{height:36px;border-radius:8px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.bar{position:sticky;top:0;background:#fff;border-bottom:4px solid var(--r);padding:8px 0 10px;z-index:5}.bar .row{justify-content:space-between}
.pill{background:var(--s);border:2px solid var(--b);border-radius:999px;padding:1px 14px;font-size:16px;font-weight:600}#tm{background:var(--r);border-color:var(--r);color:#fff;font-size:20px}#warn{color:var(--r)}
.prog{height:14px;background:var(--b);border-radius:99px;overflow:hidden;margin-top:8px}.prog div{height:100%;width:0;background:var(--r);border-radius:99px;transition:width .3s}
.nv b{display:inline-grid;place-items:center;width:42px;height:42px;border-radius:50%;border:3px solid var(--b);margin:3px;cursor:pointer;font:800 17px "Baloo 2";color:var(--m)}.nv b.ok{background:var(--s);border-color:var(--r);color:var(--r)}.nv b.on{background:var(--r);border-color:var(--r);color:#fff}
.wm{position:fixed;inset:0;pointer-events:none;z-index:3}
.toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:var(--r);color:#fff;padding:12px 22px;border-radius:999px;font-weight:800;z-index:20;box-shadow:0 6px 18px #0004;max-width:92vw;text-align:center}
.modal{position:fixed;inset:0;background:#0008;overflow:auto;padding:16px;z-index:9}.modal>div{background:#fff;max-width:820px;margin:0 auto;border-radius:22px;padding:20px}
.big{font-size:64px;font-weight:800;color:var(--r);line-height:1.1}.msg{text-align:center}.em{font-size:64px;line-height:1.2}
.nosel{user-select:none;-webkit-user-select:none}.cert{border:4px double var(--r);border-radius:22px;padding:24px;text-align:center}
.podium{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}.pd{flex:1 1 140px;max-width:220px;text-align:center;border:3px solid var(--b);border-radius:22px;padding:12px;background:var(--s)}.pd b{display:block;font-size:18px}.pd span{font:800 28px "Baloo 2";color:var(--r)}
.pzn{border:2px dashed var(--r);border-radius:12px;padding:5px 12px;font-size:14px;color:var(--m);cursor:text}.pzn:focus{background:var(--s);outline:none}
@media(max-width:600px){body{font-size:16px}.btn{padding:10px 16px}nav a{padding:6px 10px;font-size:14px}.qt{font-size:19px}}
@media print{nav,footer,.btn,.noprint{display:none!important}body.tst main,body.tst .bar{display:none!important}}
</style></head><body><div id="app"></div><div id="mod"></div>
<script>
const $=s=>document.querySelector(s),uid=()=>'q'+Math.random().toString(36).slice(2,8);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const SB={url:'https://shfjssnqxngnmbpubdgq.supabase.co',key:'sb_publishable_NeWZ5WshEUl1BDIHDUuUOg_S8cGXLmb'}; // isi Project URL & anon key Supabase (lihat README). Kosong = mode GitHub saja
const rpc=(f,a)=>fetch(SB.url+'/rest/v1/rpc/'+f,{method:'POST',headers:{apikey:SB.key,Authorization:'Bearer '+SB.key,'Content-Type':'application/json'},body:JSON.stringify(a||{})}).then(async r=>{const j=await r.json().catch(()=>null);if(!r.ok)throw new Error((j&&j.message)||r.status);return j});
const DEF={cfg:{id:'main',title:'Asesmen Sumatif Akhir Semester',sub:'Selamat datang! Kerjakan dengan jujur dan teliti.',about:'Tes ini untuk siswa kelas 6. Baca petunjuk dengan saksama sebelum mulai.',school:'SD Negeri Selomerto',hero:'',pwh:'240be518fabd2724ddb6f04eeb1da5967448d7e831c08c8fa822809f74c720a9',only:false,dur:60,maxV:3,shuf:true,shufOpt:true,pub:false,retake:false},
soal:[{id:'s1',mp:'m1',type:'pg',text:'Ibu kota Indonesia saat ini adalah ...',stim:{k:'none',v:''},opts:[{t:'Bandung'},{t:'Jakarta'},{t:'Surabaya'},{t:'Medan'}],key:1,pts:1},
{id:'s2',mp:'m1',type:'mcma',text:'Pilih 2 bilangan prima!',stim:{k:'text',v:'Perhatikan bilangan: 4, 7, 9, 11'},opts:[{t:'4'},{t:'7'},{t:'11'}],key:[1,2],pts:1},
{id:'s3',mp:'m1',type:'kat',text:'Tentukan benar atau salah!',stim:{k:'none',v:''},lab:'Benar|Salah',opts:[{t:'2 + 3 = 5'},{t:'10 - 4 = 5'},{t:'3 x 3 = 9'}],key:[true,false,true],pts:1},
{id:'s4',mp:'m1',type:'isian',text:'Hasil 12 x 5 = ...',stim:{k:'none',v:''},key:'60',pts:1},
{id:'s5',mp:'m1',type:'jodoh',text:'Jodohkan negara dengan ibu kotanya!',stim:{k:'none',v:''},pairs:[{l:'Jepang',r:'Tokyo'},{l:'Thailand',r:'Bangkok'}],pts:2},
{id:'s6',mp:'m1',type:'uraian',text:'Sebutkan 2 manfaat menabung!',stim:{k:'none',v:''},key:'masa depan,darurat,kebutuhan',pts:2}],peserta:[],hasil:[],mapel:[{id:'m1',nama:'Matematika',dur:60,pub:true}]};
let db=JSON.parse(JSON.stringify(DEF)),view='home',at='landing',PW=sessionStorage.pw||'',A={},T=null,qs=[],E=null,tgt=null,last=null,tmr=null;
const store=()=>{if(SB.url||!adm())return;try{localStorage.cbt_draft=JSON.stringify(db)}catch(e){alert('Penyimpanan browser penuh. Kurangi ukuran/jumlah gambar.')}};
const mine=()=>{try{return JSON.parse(localStorage.cbt_mine)||[]}catch(e){return[]}};
const sha=async s=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)))].map(b=>b.toString(16).padStart(2,'0')).join('');
const enc=h=>btoa(unescape(encodeURIComponent(JSON.stringify(h))));
async function load(){if(SB.url){try{const d=await rpc('app_load',{p_pw:PW||null});db={...db,...d};if(PW&&!d.adm){PW='';sessionStorage.pw=''}}catch(e){$('#app').innerHTML='<main><h2>Gagal terhubung ke database</h2><p>Periksa URL dan key Supabase di index.html, lalu muat ulang. ('+esc(e.message)+')</p></main>';return}}
else{let d=null;try{const r=await fetch('data.json?'+Date.now());if(r.ok)d=await r.json()}catch(e){}
if(PW){try{d=JSON.parse(localStorage.cbt_draft)||d}catch(e){}}
if(d)db={...db,...d}}
db.cfg={...DEF.cfg,...db.cfg};db.mapel=db.mapel||DEF.mapel;db.hasil=db.hasil||[];db.soal.forEach(q=>q.mp=q.mp||'m1');R()}
async function sv(sh,rec){if(sh!='cfg'){const i=db[sh].findIndex(x=>x.id==rec.id);i<0?db[sh].push(rec):db[sh][i]=rec}
if(SB.url){if(sh=='cfg'){rec={...rec};delete rec.pwh}try{await rpc('admin_put',{p_pw:PW,p_tbl:sh,p_rec:rec})}catch(e){alert('Gagal menyimpan ke database: '+e.message)}return}store()}
async function rm(sh,id){db[sh]=db[sh].filter(x=>x.id!=id);if(SB.url){try{await rpc('admin_del',{p_pw:PW,p_tbl:sh,p_id:id})}catch(e){alert('Gagal menghapus: '+e.message)}return}store()}
const adm=()=>!!PW;
function go(v){view=v;R();scrollTo(0,0);if(SB.url&&['home','board','unduh','admin'].includes(v))load()}
function R(){document.documentElement.style.setProperty('--r',db.cfg.color||'#d7263d');
const nv=[['home','🏠 Dashboard'],['daftar','✏️ Daftar dan Kerjakan Tes'],['board','🏆 Leader Board'],['unduh','📄 Unduh Hasil'],['admin',adm()?'⚙️ Admin':'🔑 Login Admin']];
const body={home,daftar,board,unduh,admin,tes,hasil}[view]();
$('#app').innerHTML=(view=='tes'?'':`<nav><b>🏫 ${esc(db.cfg.school)}</b>${nv.map(n=>`<a class="${view==n[0]?'on':''}" onclick="go('${n[0]}')">${n[1]}</a>`).join('')}</nav>`)+`<main>${body}</main><footer>Dikembangkan oleh: yulianto871</footer>`;document.body.classList.toggle('tst',view=='tes');if(view=='tes')postTes()}
// ---------- tampilan siswa
const home=()=>{const c=db.cfg,n=db.hasil.length,avg=n?Math.round(db.hasil.reduce((a,h)=>a+h.skor,0)/n):0;
return `<section class=hero>${c.hero?`<img src="${esc(c.hero)}">`:''}<div><h1>🎒 ${esc(c.title)}</h1><p>${esc(c.sub)}</p><button class=btn onclick="go('daftar')">✏️ Daftar dan kerjakan tes</button></div></section><p>${esc(c.about)}</p>
<div class=stats><div><span class=em2>📚</span><b>${db.mapel.length}</b>mata pelajaran</div><div><span class=em2>✅</span><b>${n}</b>selesai</div><div><span class=em2>⭐</span><b>${avg}</b>rata-rata nilai</div></div><h2>📖 Daftar mata pelajaran</h2><div class=card><table><tr><th>Mata pelajaran</th><th>Soal</th><th>Durasi</th><th>Status</th><th></th></tr>${db.mapel.map(m=>`<tr><td>${esc(m.nama)}</td><td>${nq(m)}</td><td>${m.dur||c.dur} menit</td><td>${c.pub&&m.pub?'Dibuka':'Ditutup'}</td><td>${c.pub&&m.pub?`<button class="btn s" onclick="go('daftar')">Kerjakan</button>`:''}</td></tr>`).join('')||'<tr><td colspan=5>Belum ada mata pelajaran.</td></tr>'}</table></div>`};
const daftar=()=>`<h2>✏️ Ayo daftar dulu!</h2><div class=card><label>Nama lengkap<input id=n></label><label>Nama sekolah<input value="${esc(db.cfg.school)}" readonly></label><label>Nomor presensi<input id=p type=number min=1></label><label>Kelas<input value=6 readonly></label><label>Mata pelajaran<select id=mp>${db.mapel.filter(m=>m.pub).map(m=>`<option value="${m.id}">${esc(m.nama)} (${m.dur||db.cfg.dur} menit)</option>`).join('')||'<option value="">Belum ada tes yang dibuka</option>'}</select></label>
<p style="font-size:14px;color:var(--m)">Tes berjalan layar penuh. Pindah tab, keluar layar penuh, atau menyalin soal dicatat sebagai pelanggaran. Setelah ${db.cfg.maxV} pelanggaran, tes terkirim otomatis.</p><button class=btn onclick="mulai()">🚀 Mulai tes</button></div>`;
async function mulai(){const nama=$('#n').value.trim(),no=$('#p').value.trim(),c=db.cfg,mp=($('#mp')||{}).value,m=db.mapel.find(x=>x.id==mp);
if(!nama||!no)return alert('Isi nama lengkap dan nomor presensi.');if(!m)return alert('Pilih mata pelajaran.');let L,sisa;
if(SB.url){let r;try{r=await rpc('app_start',{p_nama:nama,p_no:no,p_mp:mp})}catch(e){return alert('Gagal terhubung ke database: '+e.message)}if(!r.ok)return alert(r.err);L=r.soal;sisa=r.sisa}else{
if(!c.pub||!m.pub)return alert('Tes belum dibuka oleh guru.');
if(c.only&&!db.peserta.some(p=>p.presensi==no&&p.nama.trim().toLowerCase()==nama.toLowerCase()))return alert('Nama dan nomor presensi belum terdaftar. Hubungi guru.');
L=db.soal.filter(q=>q.mp==mp);if(!L.length)return alert('Soal belum tersedia.');
if(!c.retake&&db.hasil.concat(mine()).some(h=>h.presensi==no&&h.mp==mp))return alert('Nomor presensi ini sudah mengerjakan tes ini.');
let run;try{run=JSON.parse(localStorage.cbt_run)}catch(e){}
if(run&&run.no==no&&run.mp==mp)sisa=Math.max(30,Math.round((run.end-Date.now())/1000));else localStorage.cbt_run=JSON.stringify({no,mp,end:Date.now()+(m.dur||c.dur)*60000});
L=JSON.parse(JSON.stringify(L))}
L.forEach(q=>{delete q._o;delete q._r});qs=c.shuf?shf(L,no):L;A={};T={nama,no,mp,mn:m.nama,v:0,end:Date.now()+(sisa||(m.dur||c.dur)*60)*1000,t0:Date.now(),lv:0};
try{await document.documentElement.requestFullscreen()}catch(e){}
cur=0;view='tes';R();clearInterval(tmr);tmr=setInterval(tick,500)}
function tick(){const s=Math.max(0,Math.round((T.end-Date.now())/1000));const e=$('#tm');if(e)e.textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');if(!s)kirim()}
const tes=()=>{const q=qs[cur],last=cur>=qs.length-1;return `<div class="bar noprint"><div class=row><span class=pill>👤 ${esc(T.nama)}</span><span class=pill>📘 ${esc(T.mn)}</span><span class=pill id=warn>⚠️ ${T.v}/${db.cfg.maxV}</span><span class=pill id=tm></span></div><div class=prog><div id=pg></div></div></div><div class=wm id=wm></div>
<div class=nosel><div class=card>${qH(q,cur+1,qs.length)}</div></div>
<div class="row noprint" style="justify-content:space-between"><button class="btn o" onclick="nav(-1)" ${cur?'':'disabled'}>⬅️ Sebelumnya</button>${last?`<button class=btn onclick="T.lv=Date.now()+8000;if(confirm('Yakin sudah selesai? Jawabanmu akan dikirim.'))kirim()">✅ Selesai dan Kirim</button>`:`<button class=btn onclick="nav(1)">Berikutnya ➡️</button>`}</div><div class="card nv noprint" id=nv></div>`};
function viol(m){if(view!='tes'||!T||T.done||Date.now()-T.lv<1500)return;T.lv=Date.now();T.v++;const w=$('#warn');if(w)w.textContent='⚠️ '+T.v+'/'+db.cfg.maxV;toast('⚠️ Ups! Tetap di halaman tes ya ('+m+'). Peringatan '+T.v+' dari '+db.cfg.maxV);if(T.v>=db.cfg.maxV)kirim()}
document.addEventListener('visibilitychange',()=>document.hidden&&viol('pindah tab'));addEventListener('blur',()=>viol('keluar jendela'));
document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement&&view=='tes'&&!T.done){viol('keluar layar penuh');fsb()}});
function fsb(){if($('#fsb'))return;const d=document.createElement('div');d.id='fsb';d.className='modal';d.innerHTML='<div style="text-align:center"><h2>Layar penuh diperlukan</h2><p>Kembali ke layar penuh untuk melanjutkan tes. Waktu tetap berjalan.</p><button class=btn onclick="document.documentElement.requestFullscreen().catch(()=>{});this.closest(\'#fsb\').remove()">Lanjutkan tes</button></div>';document.body.appendChild(d)}
['copy','cut','paste','contextmenu','dragstart'].forEach(e=>document.addEventListener(e,x=>{if(view=='tes'){x.preventDefault()}}));
document.addEventListener('keydown',e=>{if(view=='tes'&&(e.key=='F12'||e.key=='PrintScreen'||(e.ctrlKey||e.metaKey)&&'cuspaix'.includes(e.key.toLowerCase()))){e.preventDefault()}});
addEventListener('beforeunload',e=>{if(view=='tes'&&!T.done){e.preventDefault();e.returnValue=''}});
async function kirim(){if(T.done)return;T.done=true;clearInterval(tmr);
let h;if(SB.url){try{const r=await rpc('app_submit',{p_no:T.no,p_mp:T.mp,p_a:A,p_viol:T.v});if(r.err)throw new Error(r.err);h=r.h;db.hasil.push(h)}catch(e){alert('Gagal mengirim: '+e.message+'. Mencoba lagi dalam 15 detik.');T.done=false;T.end=Date.now()+15000;tmr=setInterval(tick,500);return}}else h={id:uid(),nama:T.nama,presensi:T.no,mp:T.mp,mn:T.mn,kelas:6,sekolah:db.cfg.school,skor:score(qs,A),durasi:Math.round((Date.now()-T.t0)/1000),viol:T.v,waktu:new Date().toLocaleString('id-ID'),jawaban:A};
try{localStorage.cbt_mine=JSON.stringify([...mine(),h]);localStorage.removeItem('cbt_run')}catch(e){}
last=h;if(document.fullscreenElement)document.exitFullscreen();view='hasil';R()}
function dlH(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(last)],{type:'application/json'}));a.download='hasil-'+last.presensi+'-'+(last.mn||'tes').replace(/\W+/g,'_')+'.json';a.click()}

function shf(a,s){let h=1779033703;for(const c of String(s))h=Math.imul(h^c.charCodeAt(0),3432918353);let t=h;const r=()=>{t=t+1831565813|0;let x=Math.imul(t^t>>>15,1|t);x=x+Math.imul(x^x>>>7,61|x)^x;return((x^x>>>14)>>>0)/4294967296};const b=a.slice();for(let i=b.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
const hk=q=>q.type=='pg'?q.key!=null:q.type=='mcma'||q.type=='kat'?(q.key||[]).length>0:q.type=='jodoh'?q.pairs.every(p=>p.r):String(q.key||'').trim()!=='';
function sc(q,a){if(a==null||a==='')return 0;const n=s=>String(s).trim().toLowerCase();
switch(q.type){case'pg':return a===q.key?1:0;
case'mcma':return[...a].sort()+''==[...q.key].sort()+''?1:0;
case'kat':return q.key.filter((k,i)=>a[i]===k).length/q.key.length;
case'isian':return q.key.split('|').some(k=>n(k)==n(a))?1:0;
case'jodoh':return q.pairs.filter((p,i)=>a[i]===p.r).length/q.pairs.length;
default:{const w=q.key.split(',').map(n).filter(Boolean);return w.length?w.filter(x=>n(a).includes(x)).length/w.length:0}}}
